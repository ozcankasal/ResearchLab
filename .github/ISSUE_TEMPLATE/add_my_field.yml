name: Add my field
description: Help the lab bring the right experts to projects in your field
title: "Domain pack: "
labels: ["domain pack"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! You don't need to write code; describe the field and we can build the pack together. Personas stay fictional, so please don't propose real people as personas; their work can be cited instead.
  - type: input
    id: field
    attributes:
      label: Field and OECD code
      description: The OECD Fields of Science codes are listed in skills/lab-cast/catalogue/rules.toml.
      placeholder: "Ecology, 1.5 Earth and related environmental sciences"
    validations:
      required: true
  - type: textarea
    id: subfields
    attributes:
      label: Subfields and keywords
      description: The phrases a project in this field would use to describe itself.
  - type: textarea
    id: skeptic
    attributes:
      label: How claims die in this field
      description: The confounders, artefacts, missing controls or rival explanations a skeptical referee raises first.
    validations:
      required: true
  - type: textarea
    id: databases
    attributes:
      label: Where the literature lives
      description: The databases, archives and preprint servers researchers in the field search.
  - type: textarea
    id: standards
    attributes:
      label: Methods and reporting standards
      description: The usual methods, and any reporting guidelines venues expect.
  - type: dropdown
    id: help
    attributes:
      label: Would you like to open the pull request?
      options:
        - "Yes"
        - "Yes, with some help"
        - "No, but I can review a draft"
