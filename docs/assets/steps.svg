<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="330" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="50" y="26" width="350" height="250" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="50" y="26" width="350" height="8" rx="4" fill="#0d9488"/><circle cx="92" cy="80" r="22" fill="#0d9488"/><text x="92" y="88" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">1</text><text x="128" y="88" font-size="21" font-weight="700" fill="#0f172a">Get the lab</text>
  <text x="74" y="134" font-size="15.5" fill="#334155">On this page, click Code, then</text>
  <text x="74" y="157" font-size="15.5" fill="#334155">Download ZIP. Unzip it into your</text>
  <text x="74" y="180" font-size="15.5" fill="#334155">Documents folder.</text>
  <rect x="70" y="218" width="310" height="38" rx="10" fill="#0f172a"/><text x="86" y="242" font-size="14" fill="#94a3b8" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">&gt;</text><text x="104" y="242" font-size="14.5" fill="#e2e8f0" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">Documents/ResearchLab</text>
  <path d="M408,151 l28,0" stroke="#94a3b8" stroke-width="2.5"/><path d="M434,143 l10,8 l-10,8" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="450" y="26" width="350" height="250" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="450" y="26" width="350" height="8" rx="4" fill="#d97706"/><circle cx="492" cy="80" r="22" fill="#d97706"/><text x="492" y="88" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">2</text><text x="528" y="88" font-size="21" font-weight="700" fill="#0f172a">Open a project folder</text>
  <text x="474" y="134" font-size="15.5" fill="#334155">Make an empty folder and open it in</text>
  <text x="474" y="157" font-size="15.5" fill="#334155">your AI assistant. Ask it to set the</text>
  <text x="474" y="180" font-size="15.5" fill="#334155">lab up; it asks before installing</text>
  <text x="474" y="203" font-size="15.5" fill="#334155">anything.</text>
  <rect x="470" y="218" width="310" height="38" rx="10" fill="#0f172a"/><text x="486" y="242" font-size="14" fill="#94a3b8" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">&gt;</text><text x="504" y="242" font-size="14.5" fill="#e2e8f0" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">Set up the Research Lab here</text>
  <path d="M808,151 l28,0" stroke="#94a3b8" stroke-width="2.5"/><path d="M834,143 l10,8 l-10,8" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="850" y="26" width="350" height="250" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="850" y="26" width="350" height="8" rx="4" fill="#e11d48"/><circle cx="892" cy="80" r="22" fill="#e11d48"/><text x="892" y="88" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">3</text><text x="928" y="88" font-size="21" font-weight="700" fill="#0f172a">Talk to Nadia</text>
  <text x="874" y="134" font-size="15.5" fill="#334155">Describe your idea in plain words, in</text>
  <text x="874" y="157" font-size="15.5" fill="#334155">any language. Nadia classifies the</text>
  <text x="874" y="180" font-size="15.5" fill="#334155">project and invites its specialists.</text>
  <rect x="870" y="218" width="310" height="38" rx="10" fill="#0f172a"/><text x="886" y="242" font-size="14" fill="#94a3b8" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">&gt;</text><text x="904" y="242" font-size="14.5" fill="#e2e8f0" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">Talk to Nadia</text>
  <text x="600.0" y="316" text-anchor="middle" font-size="14" fill="#64748b">No programming needed. Everything the lab writes stays in your project folder.</text>
</svg>
