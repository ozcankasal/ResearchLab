# How a project's classification turns into its cast, story types, reporting standard, search
# databases and extra gates. Read by scripts/cast_plan.py. Fields follow the OECD Fields of Science
# and Technology; modes, outputs and sensitivities are the lab's own axes (help/classification.md).

# ---------- fields: where to search, which domain packs apply ----------

[areas."1"]
name = "Natural sciences"
search = ["arXiv", "OpenAlex", "Semantic Scholar", "Crossref", "Google Scholar"]

[areas."2"]
name = "Engineering and technology"
search = ["IEEE Xplore", "ACM Digital Library", "Scopus", "OpenAlex", "Google Scholar"]

[areas."3"]
name = "Medical and health sciences"
search = ["PubMed/MEDLINE", "Cochrane Library", "Embase", "ClinicalTrials.gov", "OpenAlex"]

[areas."4"]
name = "Agricultural sciences"
search = ["CAB Abstracts", "AGRIS", "Scopus", "OpenAlex", "Google Scholar"]

[areas."5"]
name = "Social sciences"
search = ["Scopus", "SSRN", "RePEc", "PsycINFO", "ERIC", "OpenAlex", "Google Scholar"]

[areas."6"]
name = "Humanities"
search = ["JSTOR", "PhilPapers", "MLA International Bibliography", "library catalogues and archives", "Google Scholar"]

[fields."1.1"]
name = "Mathematics"
search = ["zbMATH Open", "MathSciNet", "OEIS (fingerprint search)"]

[fields."1.2"]
name = "Computer and information sciences"
search = ["DBLP", "ACM Digital Library", "Papers with Code"]

[fields."1.3"]
name = "Physical sciences"
search = ["INSPIRE-HEP", "NASA ADS"]

[fields."1.4"]
name = "Chemical sciences"
search = ["SciFinder", "PubChem"]

[fields."1.6"]
name = "Biological sciences"
search = ["PubMed", "bioRxiv"]

[fields."5.2"]
name = "Economics and business"
search = ["RePEc/IDEAS", "SSRN", "NBER working papers"]

[fields."5.5"]
name = "Law"
search = ["legislation and case-law databases of the relevant jurisdiction", "SSRN"]

[fields."6.3"]
name = "Philosophy, ethics and religion"
search = ["PhilPapers", "Stanford Encyclopedia of Philosophy"]

# ---------- modes: how the project produces knowledge ----------

[modes.formal]
label = "Formal: definitions, theorems and proofs"
stories = ["THM", "LEM", "FORMAL"]
methods = ["lab-method-formalist", "lab-method-calculator"]
reporting = "Every statement with its hypotheses; proofs with an empty gap list after an adversarial reading (lab-prove)."

[modes.computational]
label = "Computational: simulation, numerical work, machine learning"
stories = ["EXP", "CODE"]
methods = ["lab-method-simulation"]
reporting = "Seeds, baselines tuned with the same budget, compute used, and code and data availability; for machine learning, a NeurIPS-style paper checklist."

[modes.experimental]
label = "Experimental: controlled experiments in the lab or the field"
stories = ["EXP", "DATA"]
methods = ["lab-method-experimental"]
reporting = "The field's guideline for experimental studies; in health research, the EQUATOR Network's guidelines for the study type (for example the CONSORT family for randomised trials)."

[modes.observational]
label = "Observational: data, surveys, cohorts, registries"
stories = ["STUDY", "DATA"]
methods = ["lab-method-causal"]
reporting = "A guideline for observational studies (in health research, the STROBE family listed by the EQUATOR Network), with the confounders and the analysis plan stated before the analysis."

[modes.qualitative]
label = "Qualitative: interviews, ethnography, close reading"
stories = ["STUDY", "DATA"]
methods = ["lab-method-qualitative"]
reporting = "A qualitative reporting guideline (the EQUATOR Network lists those for qualitative research), with sampling, coding and reflexivity described."

[modes.design]
label = "Design: building and evaluating an artifact, system or method"
stories = ["CODE", "STUDY"]
methods = ["lab-method-design"]
reporting = "Evaluation on realistic tasks against strong baselines; the artifact itself available and runnable."

[modes.synthesis]
label = "Synthesis: systematic or scoping reviews, meta-analysis"
stories = ["LIT", "DATA"]
methods = ["lab-method-synthesis"]
reporting = "PRISMA 2020 for systematic reviews, PRISMA-ScR for scoping reviews, with the search log reported to PRISMA-S."

[modes.archival]
label = "Archival and historical: primary sources, texts, records"
stories = ["LIT", "DATA"]
methods = ["lab-method-archival"]
reporting = "Every primary source cited with archive, collection and item, and its provenance discussed."

# ---------- outputs ----------

[outputs.paper]
stories = ["WRITE"]

[outputs.software]
stories = ["CODE"]
gates = ["G5: licence, citation file and a release that runs from a clean copy"]

[outputs.dataset]
stories = ["DATA"]
gates = ["G5: dataset licence, documentation and FAIR metadata; no personal data unless lawfully shared"]

[outputs.patent]
guardians = ["lab-guest-ipofficer"]
gates = ["G2: decide publish versus protect before any disclosure"]

[outputs.report]
stories = ["WRITE"]

# ---------- sensitivities: who must be in the room, and what the gates add ----------

[sensitivities.human-participants]
guardians = ["lab-guest-ethics"]
stories = ["DECIDE"]
gates = ["G2: ethics committee or IRB approval before any recruitment or data collection; consent procedure written; preregistration for confirmatory studies"]

[sensitivities.personal-data]
guardians = ["lab-guest-dataprotection"]
gates = ["G2: lawful basis, data minimisation and a data management plan; an impact assessment where the law requires one (for example GDPR or KVKK)", "G5: no personal data in any deposit, figure or log"]

[sensitivities.animals]
guardians = ["lab-guest-ethics"]
gates = ["G2: animal ethics approval before any work; replacement, reduction and refinement considered"]

[sensitivities.clinical]
guardians = ["lab-guest-ethics", "lab-guest-dataprotection"]
gates = ["G2: trial registration before enrolment where required; ethics approval; data protection plan"]

[sensitivities.dual-use]
guardians = ["lab-guest-security"]
gates = ["G5: misuse and responsible-disclosure review before release"]

[sensitivities.commercial]
guardians = ["lab-guest-ipofficer"]
gates = ["G2: ownership and publish-versus-protect settled", "G5: patent and confidentiality check before any disclosure"]

[sensitivities.regulated]
guardians = ["lab-guest-ipofficer", "lab-guest-dataprotection"]
gates = ["G2: the regulator and the rules that apply are named, with what the work may and may not do"]

# ---------- rooms built for each project ----------

[rooms.seminar]
name = "{title} Seminar"
fixed = ["lab-agent-pi", "lab-agent-methods", "lab-guest-outsider"]
take = ["domain", "methods"]
scene = "The project's working seminar. The field's own experts argue about what matters and how it is usually done; the lab's PI keeps the claims testable, the methods scientist keeps them measurable, and Jamie asks for the one-paragraph version. Recommended mode: auto."

[rooms.tribunal]
name = "{title} Tribunal"
fixed = ["lab-agent-referee", "lab-agent-factchecker", "lab-guest-historian"]
take = ["skeptics", "methods", "guardians"]
scene = "The project's kill test. Viktor steelmans each claim; the field's skeptics, the method specialists and the guardians attack it from their own angle; Marta's verification rulings are binding. Verdicts are ALIVE, ALIVE-NARROW or DEAD, each with the evidence that would reverse it. Recommended mode: subagent."

[rooms.proof]
name = "{title} Proof Room"
when_modes = ["formal"]
fixed = ["lab-agent-referee", "lab-guest-outsider"]
take = ["methods-formal", "domain"]
scene = "Statements with every hypothesis on the board. Small cases are computed before anyone believes a claim, each step is asked which lemma closes it, and nothing is called proved until the gap list is empty. Recommended mode: session."

